[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "math-clarify"
version = "0.1.0a1"
description = "Offline formula normalization, ambiguity clarification, symbolic parsing, and formula-aware retrieval."
readme = "README_EN.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "RAG02 contributors"}]
keywords = ["math", "latex", "retrieval", "rag", "sympy", "formula"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shallowwater514/math-clarify"
Source = "https://github.com/shallowwater514/math-clarify"
Issues = "https://github.com/shallowwater514/math-clarify/issues"

[project.optional-dependencies]
symbolic = ["latex2sympy2-extended[antlr4_13_2]>=1.11,<2"]
ml = ["joblib>=1.3", "sklearn-crfsuite>=0.5,<1"]
all = ["latex2sympy2-extended[antlr4_13_2]>=1.11,<2", "joblib>=1.3", "sklearn-crfsuite>=0.5,<1"]
dev = ["pytest>=8", "build>=1.2", "twine>=5"]

[project.scripts]
math-clarify = "math_clarify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/math_clarify"]

[tool.hatch.build.targets.sdist]
exclude = ["/.uv-cache", "/.pytest_cache", "/dist", "/build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
